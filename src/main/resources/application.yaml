spring:
  application:
    name: alexa-skill-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alexa_skill_db}
    username: ${DB_USER:alexa_user}
    password: ${DB_PASSWORD:alexa_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}

app:
  base-url: ${APP_BASE_URL:https://possibly-tactless-glare.ngrok-free.dev}

elevenlabs:
  enabled: ${ELEVENLABS_ENABLED:true}
  api-key: ${ELEVENLABS_API_KEY:}
  voice-id: ${ELEVENLABS_VOICE_ID:}
  model-id: eleven_flash_v2_5

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-3.5-flash-lite