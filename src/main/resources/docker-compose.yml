services:
  postgres:
    image: postgres:16-alpine
    container_name: alexa-skill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alexa_skill_db
      POSTGRES_USER: alexa_user
      POSTGRES_PASSWORD: alexa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: